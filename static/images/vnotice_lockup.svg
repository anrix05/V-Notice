    <rect width="120" height="120" rx="30" ry="30" fill="#2F6BFF"/>
    <path d="M 37 40 L 60 85 L 83 40" fill="none" stroke="#F8FAFC" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"/>
