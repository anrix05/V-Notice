<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vnotice-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="vnotice-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#vnotice-bg-grad)" filter="url(#vnotice-glow)" class="vnotice-logo-bg"/>
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  
  <!-- Geometric V: Equal stroke weights, bold, letterform proportions (not a checkmark) -->
  <!-- Left arm: (26, 27) to (50, 73); Right arm: (50, 73) to (74, 27) -->
  <path d="M 26 27 L 50 73 L 74 27" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="vnotice-logo-v"/>
        
  <!-- Subtle letterform serif/stem accent on entry to emphasize 'V' character identity -->
  <line x1="22" y1="27" x2="30" y2="27" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Notification Badge at Top-Right of V: Amber (#F59E0B) with 2px ring in background color -->
  <circle cx="77" cy="23" r="10" fill="#2563EB" class="vnotice-badge-ring"/>
  <circle cx="77" cy="23" r="7.5" fill="#F59E0B" class="vnotice-badge-dot"/>
  <circle cx="75.5" cy="21.5" r="2" fill="#FDE68A" opacity="0.8"/>
</svg>
